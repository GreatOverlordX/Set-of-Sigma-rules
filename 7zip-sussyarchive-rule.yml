# 7z Suspicious archive sigma rule

title: 7-Zip Collection
id: eeb775d3-94f9-4c00-ba36-a732934eecbf
status: Testing
description: Detection of execution of a 7zip file/archive
date: 2025/01/08   # YEAR/MONTH/DAY
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    EventID: 1
    
    Image|endswith: '7z.exe'
    CommandLine|contains:
    - ' -p '
    - ' a '
  condition: selection
falsepositives: #NONE
level: high
tags:
  - attack.credential_access
  - attack.t1110

